<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pressure Ulcer AI</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  color: #2c3e50;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

label {
  font-weight: 600;
  display: block;
  margin-top: 12px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #3498db;
  color: white;
  border: none;
  margin-top: 16px;
}

.result {
  margin-top: 16px;
  padding: 12px;
  background: #ecf0f1;
  border-radius: 8px;
}
.timeline img {
  width: 100%;
  border-radius: 8px;
  margin-top: 8px;
}
</style>
</head>

<body>

<h1>Pressure Ulcer AI</h1>

<div class="card">
  <label>ชื่อผู้ป่วย</label>
  <input id="name" placeholder="กรอกชื่อผู้ป่วย" />

  <label>อายุ</label>
  <input id="age" type="number" placeholder="อายุ" />

  <label>อัปโหลดรูปแผล</label>
  <input id="image" type="file" accept="image/*" />

  <button onclick="analyze()">วิเคราะห์แผล</button>

  <div id="result" class="result"></div>
</div>

<div class="card timeline">
  <h3>ประวัติย้อนหลัง</h3>
  <div id="history"></div>
</div>

<script>
function analyze() {
  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const imageInput = document.getElementById("image");
  const resultDiv = document.getElementById("result");

  if (!name || !age || !imageInput.files[0]) {
    alert("กรอกข้อมูลให้ครบก่อน");
    return;
  }

  // Mock AI วิเคราะห์
  const stages = ["ระดับ 1", "ระดับ 2", "ระดับ 3"];
  const stage = stages[Math.floor(Math.random() * stages.length)];

  const trend = Math.random() > 0.5 ? "ดีขึ้น ✅" : "แย่ลง ❌";

  resultDiv.innerHTML = `
    <strong>ผลการวิเคราะห์</strong><br>
    แผลกดทับ: ${stage}<br>
    แนวโน้ม: ${trend}
  `;

  // บันทึกข้อมูล
  const reader = new FileReader();
  reader.onload = function(e) {
    const record = {
      date: new Date().toLocaleString(),
      stage,
      trend,
      image: e.target.result
    };

    const history = JSON.parse(localStorage.getItem("ulcerHistory") || "[]");
    history.unshift(record);
    localStorage.setItem("ulcerHistory", JSON.stringify(history));
    renderHistory();
  };
  reader.readAsDataURL(imageInput.files[0]);
}

function renderHistory() {
  const historyDiv = document.getElementById("history");
  const history = JSON.parse(localStorage.getItem("ulcerHistory") || "[]");

  historyDiv.innerHTML = "";
  history.forEach(item => {
    historyDiv.innerHTML += `
      <div class="result">
        <strong>${item.date}</strong><br>
        ${item.stage} | ${item.trend}
        <img src="${item.image}" />
      </div>
    `;
  });
}

renderHistory();
</script>

</body>
</html>
